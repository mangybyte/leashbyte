[project]
name = "leashbyte"
version = "0.1.3"
description = "Self-hosted search and page fetch APIs"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
authors = [{ name = "MangyByte Ltd" }]
dependencies = [
  "anthropic>=0.74,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=50,<51",
  "fastapi>=0.121,<1",
  "httpcore>=1.0.9,<1.1",
  "httpx>=0.28,<1",
  "leashbyte-sdk>=0.1.2,<0.2",
  "mcp>=1.26,<2",
  "playwright>=1.56,<2",
  "pydantic-settings>=2.11,<3",
  "trafilatura>=2.0,<3",
  "uvicorn[standard]>=0.38,<1",
  "websockets>=15,<16",
]

[project.urls]
Homepage = "https://leashbyte.com"
Repository = "https://github.com/mangybyte/leashbyte"
Issues = "https://github.com/mangybyte/leashbyte/issues"
Changelog = "https://github.com/mangybyte/leashbyte/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
leashbyte-mcp = "leashbyte.mcp.server:main"

[tool.uv.sources]
leashbyte-sdk = { path = "sdk/python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/leashbyte"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC", "S"]
ignore = ["S101", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S104"]
