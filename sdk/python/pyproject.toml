[project]
name = "leashbyte-sdk"
version = "0.1.0"
description = "Python client for the LeashByte API"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "MangyByte Ltd" }]
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
]

[project.urls]
Homepage = "https://leashbyte.com"
Repository = "https://github.com/mangybyte/leashbyte"
Issues = "https://github.com/mangybyte/leashbyte/issues"
Changelog = "https://github.com/mangybyte/leashbyte/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leashbyte_sdk"]
