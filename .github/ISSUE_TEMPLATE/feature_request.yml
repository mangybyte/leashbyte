name: Feature request
description: Suggest a change or something new.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        If your idea comes from a way around one of LeashByte's protections, please send it through the [private report form](https://github.com/mangybyte/leashbyte/security/advisories/new) or to `security@leashbyte.com` instead.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you'd like it to work. A rough sketch of the API or config is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you looked at
      description: Workarounds you've tried, or other approaches and why they fall short.
    validations:
      required: false
