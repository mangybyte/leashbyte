name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.13.4
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check src tests sdk/python/src examples ci/mcp_roundtrip.py scripts/python_licenses.py
          uv run ruff format --check src tests sdk/python/src examples ci/mcp_roundtrip.py scripts/python_licenses.py
      - name: Check the Python licence inventory
        run: uv run python scripts/python_licenses.py --check
      - name: Test essential security and API contracts
        run: uv run pytest -q tests
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Check the TypeScript SDK and JavaScript licences
        run: |
          npm ci --prefix sdk/typescript
          uv run python scripts/generate_openapi.py
          uvx --from datamodel-code-generator==0.91.0 datamodel-codegen \
            --input openapi.json \
            --input-file-type openapi \
            --output sdk/python/src/leashbyte_sdk/_models.py \
            --output-model-type pydantic_v2.BaseModel \
            --use-standard-collections \
            --use-annotated \
            --enum-field-as-literal all \
            --target-python-version 3.13 \
            --use-schema-description \
            --use-field-description \
            --disable-timestamp
          uv run ruff format sdk/python/src/leashbyte_sdk/_models.py
          npm --prefix sdk/typescript run generate
          git diff --exit-code -- openapi.json sdk/python/src/leashbyte_sdk/_models.py sdk/typescript/src/schema.ts
          npm --prefix sdk/typescript test
          npm --prefix sdk/typescript run licenses
          git diff --exit-code -- sdk/typescript/THIRD_PARTY_LICENSES.json

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked site dependencies
        run: npm ci --prefix site
      - name: Build the static site
        run: npm --prefix site run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.13.4
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Create local configuration
        run: |
          cp .env.example .env
          sed -i "s/replace-with-a-random-api-key/$(openssl rand -hex 32)/" .env
          sed -i "s/replace-with-a-different-random-secret/$(openssl rand -hex 32)/" .env
          sed -i "s/replace-with-a-random-service-key/$(openssl rand -hex 32)/" .env
          sed -i "s/replace-with-a-random-vault-manage-key/$(openssl rand -hex 32)/" .env
          sed -i "s/replace-with-a-random-vault-resolve-key/$(openssl rand -hex 32)/" .env
          sed -i "s/replace-with-a-random-cdp-capability-key/$(openssl rand -hex 32)/" .env
          sed -i "s/replace-with-a-random-vault-master-key/$(openssl rand -hex 32)/" .env
          sed -i "s/replace-with-a-random-postgres-password/$(openssl rand -hex 32)/" .env
          printf '%s\n' 'LEASHBYTE_PRIVATE_NETWORK_ALLOWLIST=host.docker.internal:18765' >> .env
      - name: Start the controlled HTTP fixture
        run: python ci/http_fixture.py &
      - name: Start and check the Compose stack
        run: |
          docker compose up --build -d --wait
          bash ci/compose-smoke.sh
          LEASHBYTE_API_KEY="$(sed -n 's/^LEASHBYTE_API_KEY=//p' .env)" uv run python ci/mcp_roundtrip.py
      - name: Show service logs after a failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the Compose stack
        if: always()
        run: docker compose down -v
